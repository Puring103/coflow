[package]
name = "coflow"
version = "0.10.2"
edition = "2021"
description = "Project-level command-line tools for Coflow."
license = "Apache-2.0"
repository = "https://github.com/Puring103/coflow"
publish = false

[lints]
workspace = true

[[bin]]
name = "coflow"
path = "src/main.rs"

[workspace]
members = [
    "crates/coflow-format",
    "crates/coflow-language",
    "crates/coflow-diagnostics",
    "crates/coflow-model",
    "crates/coflow-checker",
    "crates/coflow-codegen",
    "crates/coflow-lsp",
    "crates/coflow-runtime",
    "crates/coflow-staging",
    "crates/coflow-codegen-csharp",
    "editors/cfd-editor/core",
    "editors/cfd-editor/src-tauri",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
redundant_pub_crate = "allow"

[dependencies]
atomicwrites = "0.4.4"
clap = { version = "4", features = ["derive"] }
coflow-format = { path = "crates/coflow-format" }
coflow-lsp = { path = "crates/coflow-lsp" }
coflow-runtime = { path = "crates/coflow-runtime" }
dirs = "6"
include_dir = "0.7"
self_update = { version = "0.42", default-features = false, features = ["archive-tar", "compression-flate2", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
