[workspace]
members = [
    # Engine 的生产依赖全部位于 engine 内。
    "engine/crates/coflow-language",
    "engine/crates/coflow-diagnostics",
    "engine/crates/coflow-core",
    "engine/crates/coflow-ffi",
    # Studio 复用 Engine，负责项目与制作工具。
    "studio/cli",
    "studio/crates/coflow-project",
    "studio/crates/coflow-format",
    "studio/crates/coflow-codegen",
    "studio/crates/coflow-codegen-csharp",
    "studio/crates/coflow-lsp",
    "studio/crates/coflow-staging",
    "studio/editors/cfd-editor/core",
    "studio/editors/cfd-editor/src-tauri",
]
default-members = ["studio/cli"]
resolver = "2"

[workspace.package]
version = "0.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
redundant_pub_crate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
