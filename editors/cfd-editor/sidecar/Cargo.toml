[package]
name = "cfd-editor-sidecar"
version = "0.9.1"
edition = "2021"
description = "Host-neutral stdio bridge for the CFD editor core"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
cfd-editor-core = { path = "../core" }
coflow-runtime = { path = "../../../crates/coflow-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
