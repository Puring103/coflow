name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  ci:
    name: Release gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Select release gate and validate version
        id: gate
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.(\d+)$') {
            throw "Expected release version X.Y.Z, got $version"
          }
          # 新版本系列的首版执行完整门禁，补丁版本执行普通 Rust 门禁。
          $full = [int]$Matches[1] -eq 0
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version"
          }
          # 发布说明只保留当前主次版本系列，并以正在发布的版本作为首个标题。
          $releaseHeadings = @(
            Select-String -Path RELEASE_NOTES.md -Pattern '^# Coflow (\d+)\.(\d+)\.(\d+)$' |
              ForEach-Object { $_.Matches[0] }
          )
          if ($releaseHeadings.Count -eq 0) {
            throw "RELEASE_NOTES.md must start with # Coflow $version"
          }
          $firstLine = Get-Content -Path RELEASE_NOTES.md -TotalCount 1
          if ($firstLine -ne "# Coflow $version") {
            throw "RELEASE_NOTES.md must start with # Coflow $version"
          }
          $firstReleaseVersion = $releaseHeadings[0].Groups[1..3].Value -join "."
          if ($firstReleaseVersion -ne $version) {
            throw "RELEASE_NOTES.md starts with $firstReleaseVersion instead of $version"
          }
          $currentSeries = $releaseHeadings[0].Groups[1..2].Value -join "."
          $historicalHeading = $releaseHeadings | Where-Object {
            ($_.Groups[1..2].Value -join ".") -ne $currentSeries
          } | Select-Object -First 1
          if ($historicalHeading) {
            $historicalVersion = $historicalHeading.Groups[1..3].Value -join "."
            throw "RELEASE_NOTES.md contains historical version $historicalVersion outside $currentSeries.x"
          }
          "full=$($full.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release $version uses $(if ($full) { 'full' } else { 'standard' }) gate"

      - name: Install full gate Rust components
        if: steps.gate.outputs.full == 'true'
        run: rustup component add rustfmt clippy

      - name: Install Node
        if: steps.gate.outputs.full == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install .NET
        if: steps.gate.outputs.full == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Sync skill references
        if: steps.gate.outputs.full == 'true'
        shell: pwsh
        run: |
          pwsh scripts/sync-skill-references.ps1
          pwsh scripts/sync-skill-references.ps1 -Check
          $skillStatus = git status --porcelain -- skills
          if ($skillStatus) {
            $skillStatus
            throw "Skill references changed after sync. Commit synced files before release."
          }

      - name: Check workspace
        run: cargo check --workspace

      - name: Check formatting
        if: steps.gate.outputs.full == 'true'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: steps.gate.outputs.full == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Build all C# runtime targets
        if: steps.gate.outputs.full == 'true'
        shell: pwsh
        run: |
          cargo build -p coflow-ffi --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run -- codegen runtimes/csharp/tests/integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build runtimes/csharp/src/Coflow.Runtime/Coflow.Runtime.csproj --configuration Release

      - name: Consume the netstandard2.1 C# runtime
        if: steps.gate.outputs.full == 'true'
        run: dotnet run --project runtimes/csharp/smoke/Coflow.Runtime.NetStandardSmoke/Coflow.Runtime.NetStandardSmoke.csproj --configuration Release

      - name: Test C# runtime with coverage
        if: steps.gate.outputs.full == 'true'
        shell: pwsh
        run: >-
          dotnet test runtimes/csharp/tests/Coflow.Runtime.Tests/Coflow.Runtime.Tests.csproj
          --configuration Release
          /p:CollectCoverage=true
          /p:CoverletOutput="$env:RUNNER_TEMP/csharp-runtime-coverage/"
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=40
          /p:ThresholdType=line%2cbranch
          /p:ThresholdStat=total

      - name: Regenerate and run C# integration
        if: steps.gate.outputs.full == 'true'
        shell: pwsh
        run: |
          cargo run -- codegen runtimes/csharp/tests/integration
          dotnet run --project runtimes/csharp/tests/integration/app/Coflow.Runtime.Example.csproj --configuration Release
          dotnet build runtimes/csharp/benchmarks/Coflow.Runtime.Benchmarks/Coflow.Runtime.Benchmarks.csproj --configuration Release

      - name: Check TypeScript bindings
        if: steps.gate.outputs.full == 'true'
        shell: pwsh
        run: |
          cargo test --features ts-export -p cfd-editor export_bindings
          git diff --exit-code editors/cfd-editor/frontend/src/bindings

      - name: Test and build CFD editor frontend
        if: steps.gate.outputs.full == 'true'
        run: npm ci && npm test && npm run build
        working-directory: editors/cfd-editor/frontend

      - name: Test VS Code extension
        if: steps.gate.outputs.full == 'true'
        run: node editors/vscode-coflow/test/extension-unit.test.js

  windows-full:
    name: Windows full installer
    needs: ci
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install editor dependencies
        run: npm ci
        working-directory: editors/cfd-editor

      - name: Install editor frontend dependencies
        run: npm ci
        working-directory: editors/cfd-editor/frontend

      - name: Build CLI sidecar
        run: cargo build --release --target $env:TARGET -p coflow

      - name: Prepare CLI sidecar
        shell: pwsh
        run: |
          $destination = "editors/cfd-editor/src-tauri/binaries/coflow-$env:TARGET.exe"
          New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
          Copy-Item "target/$env:TARGET/release/coflow.exe" $destination -Force

      - name: Build full NSIS installer
        run: npm run tauri -- build --target $env:TARGET --bundles nsis --config src-tauri/tauri.release.conf.json
        working-directory: editors/cfd-editor

      - name: Sign updater and stage release assets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured"
          }

          $installer = Get-ChildItem "target/$env:TARGET/release/bundle/nsis/*-setup.exe" |
            Select-Object -First 1
          if (-not $installer) {
            throw "Full NSIS installer was not produced"
          }

          $tauriCli = "editors/cfd-editor/node_modules/@tauri-apps/cli/tauri.js"
          $signArgs = @($tauriCli, "signer", "sign", "--password", "", $installer.FullName)
          & node $signArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to sign the updater installer"
          }

          $signaturePath = "$($installer.FullName).sig"
          $signature = (Get-Content -Raw $signaturePath).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "Updater signature is empty"
          }

          $versionLine = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1
          $version = $versionLine.Matches[0].Groups[1].Value
          $assetName = "coflow-tools-windows-x64-setup.exe"
          $tag = "v$version"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$assetName"

          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item $installer.FullName "release-assets/$assetName" -Force
          Copy-Item $signaturePath "release-assets/$assetName.sig" -Force

          $manifest = [ordered]@{
            version = $version
            notes = (Get-Content -Raw RELEASE_NOTES.md)
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM release-assets/latest.json

      - name: Upload full installer assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-full
          path: release-assets/*

  windows-cli:
    name: Windows CLI-only installer
    needs: ci
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build CLI
        run: cargo build --release --target $env:TARGET -p coflow

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build CLI-only installer
        shell: pwsh
        run: |
          $versionLine = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1
          $version = $versionLine.Matches[0].Groups[1].Value
          $input = Join-Path $pwd "dist/windows-cli/input"
          $output = Join-Path $pwd "release-assets"
          New-Item -ItemType Directory -Force $input, $output | Out-Null
          Copy-Item "target/$env:TARGET/release/coflow.exe" "$input/coflow.exe" -Force
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            packaging/windows/coflow-cli.iss `
            "/DAppVersion=$version" `
            "/DSourceDir=$input" `
            "/DOutputDir=$output"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to build CLI-only installer"
          }

      - name: Upload CLI-only installer
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-cli
          path: release-assets/coflow-cli-windows-x64-setup.exe

  macos-cli:
    name: macOS CLI ${{ matrix.arch }}
    needs: ci
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p coflow

      - name: Package CLI
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/coflow-cli-macos-${{ matrix.arch }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" coflow

      - name: Upload macOS CLI
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-cli-${{ matrix.arch }}
          path: release-assets/*

  vsix:
    name: Build VSIX
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package VSIX
        run: npx --yes @vscode/vsce package
        working-directory: editors/vscode-coflow

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: release-vsix
          path: editors/vscode-coflow/*.vsix

  release:
    name: Create Release
    needs: [windows-full, windows-cli, macos-cli, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: List release assets
        run: find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: release-assets/*
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
