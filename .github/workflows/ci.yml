name: Development CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust check and test only
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check workspace
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace

  csharp-runtime:
    name: C# runtime test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build all C# runtime targets
        run: dotnet build runtimes/csharp/Coflow.Cfd.Runtime/Coflow.Cfd.Runtime.csproj --configuration Release

      - name: Consume the netstandard2.1 C# runtime
        run: dotnet run --project runtimes/csharp/Coflow.Cfd.Runtime.NetStandardSmoke/Coflow.Cfd.Runtime.NetStandardSmoke.csproj --configuration Release

      - name: Test C# runtime with coverage
        shell: pwsh
        run: >-
          dotnet test runtimes/csharp/Coflow.Cfd.Runtime.Tests/Coflow.Cfd.Runtime.Tests.csproj
          --configuration Release
          /p:CollectCoverage=true
          /p:CoverletOutput="$env:RUNNER_TEMP/csharp-runtime-coverage/"
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=40
          /p:ThresholdType=line%2cbranch
          /p:ThresholdStat=total

      - name: Upload C# runtime coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-runtime-coverage
          path: ${{ runner.temp }}/csharp-runtime-coverage/coverage.cobertura.xml
          if-no-files-found: error

      - name: Regenerate C# integration contract
        run: cargo run -- codegen tests/csharp-runtime-integration

      - name: Run C# integration
        run: dotnet run --project tests/csharp-runtime-integration/app/Coflow.Runtime.Example.csproj --configuration Release

      - name: Build C# benchmarks
        run: dotnet build runtimes/csharp/Coflow.Cfd.Runtime.Benchmarks/Coflow.Cfd.Runtime.Benchmarks.csproj --configuration Release
