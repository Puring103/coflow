[package]
name = "coflow-lsp"
version = "0.11.0"
edition = "2021"
description = "Language Server Protocol implementation for Coflow."
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "10", optional = true, features = ["serde-compat"] }
coflow-format = { path = "../coflow-format" }
coflow-language = { path = "../../../engine/crates/coflow-language" }
coflow-core = { path = "../../../engine/crates/coflow-core" }
coflow-project = { path = "../coflow-project" }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"

[features]
ts-export = ["dep:ts-rs"]
