[package]
name = "coflow-codegen"
version = "0.11.0"
edition = "2021"
description = "Target-language code generation contracts for Coflow."
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
coflow-language = { path = "../../../engine/crates/coflow-language" }
coflow-core = { path = "../../../engine/crates/coflow-core" }
serde_json = { version = "1", features = ["preserve_order"] }
