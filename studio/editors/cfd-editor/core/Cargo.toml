[package]
name = "cfd-editor-core"
version = "0.11.0"
edition = "2021"
description = "Host-independent CFD editor sessions, operations, and file watching"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[features]
default = []
ts-export = ["coflow-lsp/ts-export", "dep:ts-rs", "coflow-project/ts-export"]

[dependencies]
atomicwrites = "0.4.4"
coflow-lsp = { path = "../../../crates/coflow-lsp" }
coflow-project = { path = "../../../crates/coflow-project" }
notify = "8"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ts-rs = { version = "10", optional = true }

[dev-dependencies]
coflow-language = { path = "../../../../engine/crates/coflow-language" }
coflow-core = { path = "../../../../engine/crates/coflow-core" }
