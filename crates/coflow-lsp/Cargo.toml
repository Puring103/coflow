[package]
name = "coflow-lsp"
version = "0.9.1"
edition = "2021"
description = "Language server implementation for Coflow CFT and CFD."
license = "Apache-2.0"
repository = "https://github.com/Puring103/coflow"
publish = false

[lints]
workspace = true

[dependencies]
coflow-language = { path = "../coflow-language" }
coflow-runtime = { path = "../coflow-runtime" }
serde_json = { version = "1", features = ["preserve_order"] }
