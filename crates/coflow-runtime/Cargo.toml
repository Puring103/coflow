[package]
name = "coflow-runtime"
version = "0.9.1"
edition = "2021"
description = "Shared Coflow project runtime."
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[features]
default = []
internal-check-bench = []
ts-export = [
    "dep:ts-rs",
    "coflow-data-model/ts-export",
]

[dependencies]
coflow-cfd = { path = "../coflow-cfd" }
coflow-cft = { path = "../coflow-cft" }
coflow-checker = { path = "../coflow-checker" }
coflow-data-model = { path = "../coflow-data-model" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
ts-rs = { version = "10", optional = true }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "check_planning"
harness = false
required-features = ["internal-check-bench"]

[[bench]]
name = "check_execution"
harness = false
required-features = ["internal-check-bench"]

[[bench]]
name = "check_limits"
harness = false
required-features = ["internal-check-bench"]
