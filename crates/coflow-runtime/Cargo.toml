[package]
name = "coflow-runtime"
version = "0.10.7"
edition = "2021"
description = "Shared Coflow project runtime."
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[features]
default = []
internal-check-bench = []
ts-export = [
    "dep:ts-rs",
    "coflow-model/ts-export",
]

[dependencies]
coflow-language = { path = "../coflow-language" }
coflow-model = { path = "../coflow-model" }
coflow-checker = { path = "../coflow-checker" }
coflow-codegen = { path = "../coflow-codegen" }
coflow-codegen-csharp = { path = "../coflow-codegen-csharp" }
coflow-staging = { path = "../coflow-staging" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
ts-rs = { version = "10", optional = true }
walkdir = "2"
tempfile = "3"
dunce = "1"
gix = { version = "0.87", default-features = false, features = ["sha1", "sha256", "excludes", "blob-diff"] }

[dev-dependencies]
coflow-format = { path = "../coflow-format" }

[[bench]]
name = "check_planning"
harness = false
required-features = ["internal-check-bench"]

[[bench]]
name = "check_execution"
harness = false
required-features = ["internal-check-bench"]

[[bench]]
name = "check_limits"
harness = false
required-features = ["internal-check-bench"]
