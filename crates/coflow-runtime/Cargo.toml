[package]
name = "coflow-runtime"
version = "0.9.0"
edition = "2021"
description = "Shared Coflow project runtime."
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[features]
default = []
internal-check-bench = []
ts-export = [
    "dep:ts-rs",
    "coflow-api/ts-export",
    "coflow-data-model/ts-export",
]

[dependencies]
coflow-api = { path = "../coflow-api" }
coflow-cft = { path = "../coflow-cft" }
coflow-checker = { path = "../coflow-checker" }
coflow-data-model = { path = "../coflow-data-model" }
coflow-project = { path = "../coflow-project" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ts-rs = { version = "10", optional = true }
walkdir = "2"

[dev-dependencies]
coflow-builtins = { path = "../coflow-builtins" }
coflow-loader-csv = { path = "../coflow-loader-csv" }

[[bench]]
name = "check_planning"
harness = false
required-features = ["internal-check-bench"]

[[bench]]
name = "check_execution"
harness = false
required-features = ["internal-check-bench"]

[[bench]]
name = "check_limits"
harness = false
required-features = ["internal-check-bench"]
