[package]
name = "coflow-codegen"
version = "0.9.1"
edition = "2021"
description = "Target-language code generation contracts for Coflow."
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
coflow-language = { path = "../coflow-language" }
coflow-model = { path = "../coflow-model" }
serde_json = { version = "1", features = ["preserve_order"] }
