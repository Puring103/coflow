[package]
name = "coflow-codegen-api"
version = "0.9.1"
edition = "2021"
description = "Multi-target code generation contract for Coflow."
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
coflow-cft = { path = "../coflow-cft" }
coflow-data-model = { path = "../coflow-data-model" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
