[package]
name = "coflow-codegen-api"
version = "0.9.1"
edition = "2021"
description = "Multi-target code generation contract for Coflow."
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
coflow-language = { path = "../coflow-language" }
coflow-runtime = { path = "../coflow-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
