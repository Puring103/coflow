[package]
name = "coflow-loader-json"
version = "0.7.4"
edition = "2021"
description = "Schema-guided JSON source provider for Coflow."
license = "Apache-2.0"
repository = "https://github.com/Puring103/coflow"
publish = false

[lints]
workspace = true

[dependencies]
coflow-api = { path = "../coflow-api" }
coflow-cft = { path = "../coflow-cft" }
coflow-data-model = { path = "../coflow-data-model" }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
