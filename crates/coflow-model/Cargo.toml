[package]
name = "coflow-model"
version = "0.15.0"
edition = "2021"
description = "Schema-guided CFD data model for Coflow."
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[features]
default = []
ts-export = ["dep:ts-rs"]

[dependencies]
coflow-storage = { path = "../coflow-storage" }
coflow-diagnostics = { path = "../coflow-diagnostics" }
coflow-language = { path = "../coflow-language" }
serde = { version = "1", features = ["derive", "rc"] }
ts-rs = { version = "10", optional = true }
unicode-ident = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
