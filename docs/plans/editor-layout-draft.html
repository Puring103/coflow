<style>
:root{--accent:#087e77;--soft:#e8f4f1;--font:14px;--row:46px;--line:#e5eaed;--muted:#87939b;--bg:#f5f7f8;--text:#293942}*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--bg);font:var(--font)/1.5 "Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit;background:none;border:0}button:hover{background:#edf3f2}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.4;cursor:default}.icon{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}.flex{display:flex;align-items:center;gap:9px}.spacer{flex:1}.muted{color:var(--muted)}.small{font-size:12px}.mono,code,.num{font-family:Consolas,"Cascadia Code",monospace;font-variant-numeric:tabular-nums}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:6px 11px;border:1px solid var(--line);background:white;border-radius:6px;white-space:nowrap}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{filter:brightness(.95);background:var(--accent)}.iconbtn{display:grid;place-items:center;width:30px;height:30px;border-radius:5px}.pill{padding:2px 7px;border-radius:4px;background:#edf1f3;color:#788790;font-size:11px}.green{background:var(--soft);color:var(--accent)}.purple{background:#f0ecf9;color:#8865ad}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#2fa387}
.app{height:100vh;min-height:560px;display:grid;grid-template-rows:55px 1fr 29px;overflow:hidden}.top{display:flex;align-items:center;gap:16px;padding:0 18px;background:white;border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:700;letter-spacing:-.6px}.logo{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:white;font-size:22px}.project{border-left:1px solid var(--line);padding-left:18px;font-size:12px}.global{display:flex;align-items:center;gap:10px;position:absolute;left:50%;transform:translateX(-50%);width:340px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;text-align:left;font-size:12px;color:var(--muted)}kbd{font:10px "Segoe UI",sans-serif;border:1px solid #dce3e6;border-radius:3px;padding:0 4px;background:white;color:#8b979f}.shell{display:grid;grid-template-columns:215px 1fr;min-height:0}.sidebar{padding:17px 12px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;width:100%;text-align:left;border-radius:5px;font-size:13px;margin-bottom:3px}.nav.active{background:#e4eeeb;color:#08756d;font-weight:600}.count{margin-left:auto;font-size:11px;color:#8b979d}.label{font-size:10px;letter-spacing:1.5px;color:#919da4;margin:24px 10px 9px;font-weight:600}.folder{padding:8px 10px;color:#7b8991;font-size:12px}.file{padding-left:27px;font-size:12px}.file .icon{width:15px;height:15px}.sidefoot{padding:16px 10px;border-top:1px solid var(--line);font-size:12px;color:#7e8e97}
.workspace{display:flex;flex-direction:column;min-width:0;min-height:0;background:white}.tabs{height:41px;display:flex;flex:none;background:#f7f9fa;border-bottom:1px solid var(--line);padding-left:6px}.tab{display:flex;align-items:center;gap:9px;padding:0 17px;font-size:12px;border-right:1px solid var(--line)}.tab.active{background:white;box-shadow:inset 0 2px var(--accent);margin-bottom:-1px}.tab .icon{color:var(--accent);width:15px;height:15px}.heading{padding:19px 24px 14px;display:flex;align-items:center;gap:12px}.crumb{font-size:11px;color:var(--muted);margin-bottom:6px}.heading h1{font-size:22px;line-height:1.5;margin:0;font-weight:650;letter-spacing:-.5px}.subtitle{font-size:12px;color:#8a969e;margin-top:3px}.viewbar{display:flex;align-items:center;gap:21px;height:41px;padding:0 24px;border-bottom:1px solid var(--line);flex:none}.view{height:41px;font-size:13px;display:flex;gap:7px;align-items:center;border-bottom:2px solid transparent;padding:0 1px;color:#819098}.view.active{color:var(--accent);font-weight:600;border-color:var(--accent)}.view .icon{width:15px;height:15px}.tools{display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:1px solid var(--line);flex:none}.filter{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px 9px;border-radius:5px;width:240px;color:#98a4aa}.filter input{border:0;outline:none;background:none;width:100%;color:var(--text);font-size:12px}.tools .btn{font-size:12px}.editor{display:flex;min-height:0;flex:1;min-width:0}.main{flex:1;min-width:0;overflow:auto}.table{border-spacing:0;width:100%;white-space:nowrap}.table th{position:sticky;top:0;z-index:1;background:#f8fafb;text-align:left;height:36px;font-size:11px;font-weight:500;color:#819099;border-bottom:1px solid var(--line);padding:0 13px}.table td{height:var(--row);border-bottom:1px solid #edf1f3;padding:0 13px}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:#f6faf9}.table tr.selected{background:#edf7f4}.table tr.select .problems{border-top:1px solid var(--line);background:white;flex:none}.problemhead{height:35px;padding:0 23px;display:flex;align-items:center;gap:9px;width:100%;font-size:12px;text-align:left}.errorcount{background:#fff0e5;color:#c18149;font-size:10px;padding:0 5px;border-radius:3px}.problembody{display:none;padding:0 23px 12px}.problems.open .problembody{display:block}.problemrow{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:#fff9f5;border-radius:4px;padding:10px;font-size:12px}.warn{color:#bb7747}.status{border-top:1px solid var(--line);background:#f8fafb;display:flex;align-items:center;gap:18px;padding:0 15px;font-size:11px;color:#8a98a1}.status button{font-size:11px}.recordpage{max-width:650px;padding:25px 30px;margin:auto}.code{padding:26px;color:#498087;font-size:13px;line-height:1.9;white-space:pre-wrap}.changes{padding:23px}.change{display:flex;align-items:center;gap:22px;padding:17px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:13px}.old{color:#b77868;text-decoration:line-through}.new{color:var(--accent);background:var(--soft);padding:2px 8px;border-radius:3px}.empty{padding:45px;text-align:center;color:var(--muted)}.graph{height:450px;min-width:630px;position:relative;background-image:radial-gradient(#dbe4e6 1px,transparent 1px);background-size:20px 20px}.node{position:absolute;width:180px;background:white;border:1px solid #d9e5e3;border-radius:8px;padding:15px;box-shadow:0 4px 14px #26434d0c;font-size:12px;text-align:left}.node strong{display:block;font-size:14px;margin:5px 0}.node.focus{border:2px solid var(--accent)}.graph svg{position:absolute;width:100%;height:100%}
dialog{width:560px;background:white;color:var(--text);padding:0;border:1px solid var(--line);border-radius:11px;box-shadow:0 20px 90px #1f3c4930}dialog::backdrop{background:#263b5035;backdrop-filter:blur(2px)}.modalhead{padding:16px 20px;border-bottom:1px solid var(--line)}.modalbody{padding:20px}.settingsrow{display:flex;align-items:center;justify-content:space-between;margin:18px 0}.settingsrow select{padding:6px 10px;border:1px solid var(--line);border-radius:5px;background:white}.searchinput{width:100%;border:0;border-bottom:1px solid var(--line);padding:18px 20px;outline:none}.result{display:flex;align-items:center;gap:12px;width:100%;padding:12px 20px;text-align:left}.result .icon{color:var(--accent)}.modalfoot{padding:12px 20px;background:var(--bg);font-size:11px;color:var(--muted)}.swatch{width:24px;height:24px;border-radius:50%;border:3px solid white;outline:1px solid var(--line)}.toast{display:none;position:fixed;bottom:47px;left:50%;transform:translateX(-50%);padding:11px 18px;background:#2b4447;color:white;font-size:12px;border-radius:7px;box-shadow:0 5px 25px #243d4920;z-index:20}

/* 紧凑工作区：文档、命名视图、操作三层；数据编辑占据剩余空间。 */
:root{--row:36px}.app{grid-template-rows:46px 1fr 25px}.shell{grid-template-columns:188px 1fr}.top{padding:0 14px}.brand{font-size:18px}.logo{width:25px;height:25px}.tabs{height:34px}.heading{display:none}.viewbar{height:40px;padding:0 14px;gap:5px;background:#fff}.namedview{display:flex;align-items:center;gap:7px;height:29px;padding:0 12px;font-size:12px;border-radius:5px;color:#73848e;white-space:nowrap}.namedview.active{background:var(--soft);color:var(--accent);font-weight:600}.namedview .icon{width:14px;height:14px}.viewtype{font-size:10px;color:#98a5ad;margin-left:3px;font-weight:400}.tools{height:42px;padding:5px 14px;gap:8px}.tools .btn{padding:4px 8px;height:28px}.filter{width:205px;height:28px;padding:3px 8px}.type-select{max-width:105px}.divider{height:16px;border-left:1px solid var(--line);margin:0 3px}.detail{width:285px}.detailtop{height:36px}.table th{height:31px}.table td{height:var(--row)}.table .key{display:inline;margin-left:13px;font-size:11px;color:#9aa6ae}.table td:nth-child(3)>div:first-child{display:inline}.table td:nth-child(3){min-width:260px}.tablefoot{padding:9px 18px}.sidebar{padding:11px 9px 8px}.label{margin-top:19px}.problemhead{height:28px}.sidefoot{padding:12px 8px}.status{font-size:10px}.table td[data-cell]{cursor:cell}.table td[data-cell]:hover{box-shadow:inset 0 0 0 1px #9ccdc3;background:#f4fbf8}.cellinput{width:85px;height:26px;border:1px solid var(--accent);border-radius:3px;text-align:right;font:inherit;padding:2px 5px;background:#fff}.columnchecks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 22px}.columnchecks label{display:flex;align-items:center;gap:8px;font-size:13px}.columnchecks input{accent-color:var(--accent)}.configline{display:flex;align-items:center;gap:14px;margin:14px 0}.configline label{width:76px;font-size:13px;color:var(--muted)}.configline input,.configline select{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:white}.viewsummary{font-size:11px;color:#8b9ba4;white-space:nowrap}.tabs .small{font-size:10px}.recordpage{max-width:760px}.recordpage .key{display:block}.table td:nth-child(4){width:95px}.table th:nth-child(5),.table th:nth-child(6),.table th:nth-child(7){width:120px}

@media(max-width:940px){.tools{height:auto;min-height:42px}.viewbar{overflow-x:auto;flex-shrink:0}.detail{top:80px;bottom:25px}.shell{grid-template-columns:150px 1fr}}

</style></head><body>
<div class="app"><header class="top"><div class="flex brand"><span class="logo">c</span>coflow</div><span class="project">浮光计划 <span class="muted">⌄</span></span><button class="global" id="globalOpen"><i data-icon="search"></i>搜索记录、ID 或字段值…<span class="spacer"></span><kbd>Ctrl K</kbd></button><span class="spacer"></span><span class="flex small muted save"><span class="dot"></span><span id="saved">更改已保存</span></span><button class="btn" id="build"><i data-icon="play"></i>构建</button><button class="iconbtn" id="settingsOpen" title="外观与显示"><i data-icon="settings"></i></button></header>
<div class="shell"><aside class="sidebar"><button class="nav active" id="projectNav"><i data-icon="folder"></i>项目资源</button><button class="nav" id="searchNav"><i data-icon="search"></i>全局搜索<span class="count">Ctrl K</span></button><button class="nav" id="changesNav"><i data-icon="branch"></i>变更检查<span class="count" id="changeCount">3</span></button><div class="label">工作收藏</div><button class="nav" id="favorite"><i data-icon="star"></i>武器数值</button><button class="nav" id="problemNav"><i data-icon="alert"></i>待处理问题<span class="count" id="navProblems">1</span></button><div class="label">项目文件</div><div class="folder flex">⌄ <i data-icon="folder"></i>data</div><button class="nav file active" id="weaponFile"><i data-icon="table"></i>weapons.cfd<span class="count" id="weaponCount">12</span></button><button class="nav file" id="effectsFile"><i data-icon="link"></i>effects.cfd<span class="count">3</span></button><div class="folder flex">⌄ <i data-icon="folder"></i>schema</div><button class="nav file" id="schemaFile"><i data-icon="code"></i>combat.cft</button><span class="spacer"></span><div class="sidefoot">浮光计划 <span class="pill green">本地项目</span><div class="flex mono" style="margin-top:10px"><i data-icon="branch"></i>main</div></div><button class="nav" id="appearance"><i data-icon="settings"></i>外观与显示<span class="count">Aa</span></button></aside>
<section class="workspace"><div class="tabs"><button class="tab active" id="dataTab"><i data-icon="table"></i><span id="tabName">weapons.cfd</span><span class="muted">配置</span></button><button class="tab" id="diffTab"><i data-icon="branch"></i>变更检查<span class="pill" id="tabCount">3</span></button><span class="spacer"></span><span class="flex small muted" style="padding-right:20px">HTML 草案 · 02</span></div>
<div class="heading"><span id="breadcrumb"></span><h1 id="pageTitle"></h1><span id="typeBadge"></span><span id="pageSub"></span></div>
<div class="viewbar" id="namedViews"><div class="flex" id="viewList"></div><button class="iconbtn" id="newView" title="新建视图" aria-label="新建视图"><i data-icon="plus"></i></button><span class="spacer"></span><span class="viewsummary" id="viewSummary">全部字段 · 无筛选</span><button class="btn" id="configureView" style="font-size:12px;padding:3px 9px"><i data-icon="settings"></i>视图选项</button></div>
<div class="tools"><select class="btn type-select" id="modeSelect" aria-label="展示方式"><option value="table">▦ 表格</option><option value="record">▤ 记录</option><option value="graph">⑂ 图谱</option><option value="source">〈〉源码</option></select><span class="divider"></span><div class="filter"><i data-icon="search"></i><input id="filter" placeholder="筛选当前视图…" aria-label="筛选当前记录"><kbd>/</kbd></div><select class="btn" id="rarity" aria-label="筛选品质"><option value="">全部品质</option><option>普通</option><option>稀有</option><option>史诗</option></select><span class="small muted" id="resultCount">12 条记录</span><span class="spacer"></span><span class="small muted" id="selectionCount"></span><button class="iconbtn" id="undo" title="撤销最近一次字段修改" disabled><i data-icon="undo"></i></button><button class="btn" id="density"><i data-icon="rows"></i>紧凑</button><button class="btn" id="detailToggle"><i data-icon="panel"></i>详情</button><button class="btn primary" id="add"><i data-icon="plus"></i>新增</button></div>

<footer class="status"><span class="flex"><span class="dot"></span>项目已就绪</span><span id="statusCount">12 条记录</span><span class="spacer"></span><span>示例数据 · 修改仅在当前页面生效</span><button id="fontStatus">14px · 紧凑</button><span>UTF-8</span></footer></div>
<dialog id="searchDialog"><input class="searchinput" id="searchInput" placeholder="输入名称、ID 或字段值" aria-label="全局搜索"><div id="searchResults"></div><div class="modalfoot">搜索 weapons.cfd 与 effects.cfd<span style="float:right">Esc 关闭</span></div></dialog>
<dialog id="settingsDialog"><div class="modalhead flex"><strong>外观与显示</strong><span class="spacer"></span><button class="iconbtn" onclick="this.closest('dialog').close()" aria-label="关闭设置">×</button></div><div class="modalbody"><p class="small muted" style="margin-top:0">实时调整，找到适合长时间编辑的阅读密度。</p><div class="settingsrow"><span>界面字号</span><select id="fontSelect"><option value="13">13px · 紧凑</option><option value="14" selected>14px · 标准</option><option value="15">15px · 清晰</option><option value="16">16px · 大字</option></select></div><div class="settingsrow"><span>表格行高</span><select id="rowSelect"><option value="36" selected>36px · 紧凑</option><option value="46">46px · 舒适</option><option value="54">54px · 宽松</option></select></div><div class="settingsrow"><span>强调色</span><div class="flex"><button class="swatch" data-color="#087e77" data-soft="#e8f4f1" style="background:#087e77" aria-label="青绿"></button><button class="swatch" data-color="#466fbc" data-soft="#edf2fc" style="background:#466fbc" aria-label="蓝色"></button><button class="swatch" data-color="#8663af" data-soft="#f2ecf8" style="background:#8663af" aria-label="紫色"></button></div></div></div></dialog><dialog id="viewDialog"><div class="modalhead flex"><strong id="viewDialogTitle">视图选项</strong><span class="spacer"></span><button class="iconbtn" onclick="this.closest('dialog').close()" aria-label="关闭视图选项">×</button></div><div class="modalbody"><div class="configline"><label for="viewName">视图名称</label><input id="viewName" maxlength="30"></div><div class="configline"><label for="viewMode">展示方式</label><select id="viewMode"><option value="table">表格</option><option value="record">记录</option><option value="graph">图谱</option><option value="source">源码</option></select></div><div class="formlabel">显示字段</div><div class="columnchecks" id="columnChecks"></div><div class="configline"><label for="viewRarity">品质筛选</label><select id="viewRarity"><option value="">全部品质</option><option>普通</option><option>稀有</option><option>史诗</option></select></div><div class="configline"><label for="viewSort">排序</label><select id="viewSort"><option value="">记录顺序</option><option value="attack">攻击力 · 从高到低</option><option value="price">售价 · 从低到高</option></select></div><div class="hint">视图保存字段、品质筛选与排序；记录数据在视图间共享。</div></div><div class="modalfoot flex"><span>仅在本次预览中保存</span><span class="spacer"></span><button class="btn primary" id="saveView">应用视图</button></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
const paths={search:'m21 21-5-5 M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0',folder:'M3 6h6l2 2h10v12H3z',table:'M3 4h18v16H3z M3 9h18 M8 9v11',record:'M5 3h14v18H5z M8 8h8 M8 12h8 M8 16h5',branch:'M6 3v12a4 4 0 0 0 4 4h7 M6 8h8a4 4 0 0 0 4-4 M4 3h4 M16 3h4 M16 17h4v4h-4z',link:'M10 14l4-4 M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0 M13 17a4 4 0 0 0 6 0l4-4a4 4 0 0 0-6-6l-1 1',star:'m12 3 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z',alert:'m12 3 10 18H2z M12 9v5 M12 17v1',code:'m8 6-6 6 6 6 M16 6l6 6-6 6 M14 3l-4 18',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',panel:'M3 4h18v16H3z M14 4v16',play:'m8 4 12 8-12 8z',plus:'M12 5v14 M5 12h14',undo:'M8 5 3 10l5 5 M3 10h11a6 6 0 0 1 0 12',rows:'M4 5h16 M4 12h16 M4 19h16',sword:'m5 19 12-12 4-4v5L9 20 M4 14l6 6 M3 21l3-3'};
function icons(scope=document){scope.querySelectorAll('[data-icon]').forEach(el=>{const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('class','icon');svg.setAttribute('aria-hidden','true');const p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d',paths[el.dataset.icon]||paths.record);svg.append(p);el.replaceWith(svg)})}
const weapons=[['iron_sword','铁制长剑','普通',45,1.2,120,'physical_hit'],['frost_blade','霜语之刃','史诗',128,1.1,2400,'frost_burst'],['hunters_bow','猎人长弓','普通',38,1.6,180,'physical_hit'],['ember_staff','余烬法杖','稀有',86,1.4,960,'burning'],['silver_dagger','秘银短刃','稀有',62,.8,720,'physical_hit'],['storm_lance','风暴长枪','史诗',142,1.5,2800,'physical_hit'],['oak_shield','橡木圆盾','普通',12,2,90,'physical_hit'],['training_sword','训练木剑','普通',0,1.2,10,'physical_hit'],['flame_sword','赤焰长剑','稀有',94,1.3,1100,'burning'],['glacier_axe','冰川战斧','史诗',168,1.8,3200,'frost_burst'],['scout_crossbow','斥候手弩','普通',32,.9,160,'physical_hit'],['ash_wand','白蜡木魔杖','普通',28,1.1,140,'physical_hit']].map(x=>Object.fromEntries(['id','name','rarity','attack','speed','price','effect'].map((k,i)=>[k,x[i]])));
const effectNames={physical_hit:'物理命中',frost_burst:'寒霜爆发',burning:'灼烧'},effects=Object.entries(effectNames).map(([id,name],i)=>({id,name,rarity:'稀有',attack:[10,32,18][i],speed:1,price:0,effect:id}));
let dataset='weapons',view='table',selected=1,history=[],checked=new Set(),showDetail=false;
const changes=new Map([['frost_blade.attack',{id:'frost_blade',name:'霜语之刃',field:'attack',old:120,value:128}],['ember_staff.price',{id:'ember_staff',name:'余烬法杖',field:'price',old:900,value:960}],['flame_sword.attack',{id:'flame_sword',name:'赤焰长剑',field:'attack',old:90,value:94}]]);
const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rows=()=>dataset==='effects'?effects:weapons,current=()=>rows()[selected]||rows()[0];
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',2400)}
function form(r){return '<div class="recordicon"><i data-icon="sword"></i></div><h2>'+esc(r.name)+'</h2><div class="key mono">'+esc(r.id)+'</div><div class="formlabel">基本信息</div><div class="field"><label>显示名称</label><input aria-label="显示名称" data-field="name" value="'+esc(r.name)+'"></div><div class="field"><label>品质</label><select aria-label="品质" data-field="rarity">'+['普通','稀有','史诗'].map(q=>'<option'+(r.rarity===q?' selected':'')+'>'+q+'</option>').join('')+'</select></div><div class="formlabel">战斗属性</div><div class="pair"><div class="field"><label>攻击力</label><input aria-label="攻击力" type="number" data-field="attack" value="'+r.attack+'"><div class="hint">整数 · 必须大于 0</div></div><div class="field"><label>间隔 / 秒</label><input aria-label="间隔" type="number" step=".1" data-field="speed" value="'+r.speed+'"><div class="hint">浮点数</div></div></div><div class="field"><label>售价 / 金币</label><input aria-label="售价" type="number" data-field="price" value="'+r.price+'"></div><div class="formlabel">效果引用</div><button class="refcard" data-effect="'+r.effect+'"><i data-icon="link"></i><span>'+effectNames[r.effect]+'<div class="small muted mono">'+r.effect+'</div></span><span class="spacer"></span>↗</button><div class="hint" style="margin-top:8px">effects.cfd / Effect</div>'}
// 所有操作仅修改示例数据，不连接真实项目。
function render(){
const r=current(),diff=view==='diff',schema=view==='schema';
$('pageTitle').textContent=diff?'变更检查':schema?'战斗类型定义':dataset==='effects'?'效果配置':'武器配置';
$('pageSub').textContent=diff?'对照 HEAD 检查记录与字段的变化':schema?'武器与效果的类型结构':dataset==='effects'?'浏览武器使用的效果记录':'管理武器属性、品质与效果引用';
$('typeBadge').textContent=diff?'HEAD ↔ 工作区':schema?'CFT':dataset==='effects'?'Effect':'Weapon';
$('tabName').textContent=schema?'combat.cft':dataset+'.cfd';
$('breadcrumb').textContent=diff?'浮光计划 / 变更':schema?'浮光计划 / schema / combat.cft':'浮光计划 / data / '+dataset+'.cfd';
$('dataTab').classList.toggle('active',!diff);$('diffTab').classList.toggle('active',diff);
$('weaponFile').classList.toggle('active',!diff&&!schema&&dataset==='weapons');$('effectsFile').classList.toggle('active',!diff&&!schema&&dataset==='effects');$('schemaFile').classList.toggle('active',schema);
document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
$('detail').classList.toggle('hidden',!showDetail||!['table','graph'].includes(view));
$('detailToggle').disabled=!['table','graph'].includes(view);$('add').disabled=diff||schema||dataset==='effects';
document.querySelector('.tools').style.display=diff||schema?'none':'flex';document.querySelector('.viewbar').style.display=diff||schema?'none':'flex';
const list=rows().map((r,i)=>({r,i})).filter(({r})=>Object.values(r).join(' ').toLowerCase().includes($('filter').value.toLowerCase())&&(!$('rarity').value||r.rarity===$('rarity').value));
$('resultCount').textContent=list.length+' / '+rows().length+' 条';$('statusCount').textContent=rows().length+' 条记录';$('selectionCount').textContent=checked.size?'已选 '+checked.size+' 条':'';
const order=activeConfig().sort;if(order)list.sort((a,b)=>order==='attack'?b.r.attack-a.r.attack:a.r.price-b.r.price);
$('changeCount').textContent=changes.size;$('tabCount').textContent=changes.size;$('weaponCount').textContent=weapons.length;$('undo').disabled=!history.length;
if(view==='table'){$('main').innerHTML='<table class="table"><thead><tr><th class="rn">#</th><th></th><th>名称 <span class="muted">/ ID</span></th><th>品质</th><th class="num">攻击力</th><th class="num">间隔 / s</th><th class="num">售价</th><th>效果引用</th></tr></thead><tbody>'+list.map(({r,i})=>'<tr data-row="'+i+'" class="'+(selected===i?'selected':'')+'"><td class="rn">'+String(i+1).padStart(2,'0')+'</td><td><input type="checkbox" data-check="'+i+'" aria-label="选择'+esc(r.name)+'" '+(checked.has(i)?'checked':'')+'></td><td><div>'+esc(r.name)+'</div><div class="key mono">'+esc(r.id)+'</div></td><td><span class="pill '+(r.rarity==='史诗'?'purple':r.rarity==='稀有'?'green':'')+'">'+r.rarity+'</span></td><td class="num"><span class="'+(r.attack<=0?'bad':'')+'">'+r.attack+(r.attack<=0?' !':'')+'</span></td><td class="num">'+Number(r.speed).toFixed(1)+'</td><td class="num">'+r.price.toLocaleString()+'</td><td class="ref">'+effectNames[r.effect]+' ↗</td></tr>').join('')+'</tbody></table>'+(list.length?'':'<div class="empty">没有匹配的记录</div>')+'<div class="tablefoot"><span>选择记录查看详情</span><span class="spacer"></span><span>点击数值直接编辑 · Enter 确认 · Esc 取消</span></div>';
}else if(view==='record'){$('main').innerHTML='<div class="recordpage"><div class="flex"><button class="btn" id="prevRecord">← 上一条</button><span class="small muted">'+(selected+1)+' / '+rows().length+'</span><button class="btn" id="nextRecord">下一条 →</button></div><div style="margin-top:24px">'+form(r)+'</div></div>';$('prevRecord').onclick=()=>{selected=(selected+rows().length-1)%rows().length;render()};$('nextRecord').onclick=()=>{selected=(selected+1)%rows().length;render()};
}else if(view==='graph'){$('main').innerHTML='<div class="graph"><svg viewBox="0 0 680 450" preserveAspectRatio="none"><path d="M190 220 C290 220 270 120 390 120" fill="none" stroke="#8eb7af" stroke-width="2"/></svg><div class="node focus" style="left:5%;top:170px"><span class="small muted">Weapon</span><strong>'+esc(r.name)+'</strong><code>'+esc(r.id)+'</code></div><button class="node" data-effect="'+r.effect+'" style="left:57%;top:75px"><span class="small muted">Effect · 效果引用</span><strong>'+effectNames[r.effect]+'</strong><code>'+r.effect+'</code></button><span class="small muted" style="position:absolute;bottom:20px;left:25px">当前记录的局部关系 · 点击效果节点查看目标</span></div>';
}else if(diff){$('main').innerHTML='<div class="changes"><div class="small muted" style="margin-bottom:12px">'+changes.size+' 个字段变化 · 点击跳转到记录</div>'+[...changes.values()].map(c=>'<button class="change" data-change="'+c.id+'"><strong style="width:130px">'+esc(c.name)+'</strong><code style="width:85px">'+esc(c.field)+'</code><span class="old">'+esc(c.old)+'</span><span>→</span><span class="new">'+esc(c.value)+'</span></button>').join('')+'</div>';
}else{const source=schema?'Weapon\n  name       string\n  rarity     Rarity\n  attack     int\n  speed      float\n  price      int\n  effect     → Effect':rows().map(x=>x.id+'\n  name: '+x.name+'\n  attack: '+x.attack+'\n  speed: '+x.speed+'\n  effect: → '+x.effect).join('\n\n');$('main').innerHTML='<div class="small muted" style="padding:18px 26px 0">源码区域占位 · 以下为字段摘要，非 CFT / CFD 语法</div><pre class="code">'+esc(source)+'</pre>'}
$('detailBody').innerHTML=form(r);icons();
const invalid=weapons.filter(x=>x.attack<=0).length;$('problemCount').textContent=invalid;$('navProblems').textContent=invalid;$('jumpProblem').style.display=invalid?'flex':'none';$('noProblems').hidden=!!invalid;
document.querySelectorAll('[data-row]').forEach(el=>el.onclick=e=>{if(e.target.closest('input'))return;selected=Number(el.dataset.row);render()});
document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{const i=Number(el.dataset.check);el.checked?checked.add(i):checked.delete(i);$('selectionCount').textContent=checked.size?'已选 '+checked.size+' 条':''});
document.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>{const field=el.dataset.field,val=el.type==='number'?Number(el.value):el.value;if(el.type==='number'&&(!el.value||!Number.isFinite(val))){toast('请输入有效数字');render();return}history.push({r,field,old:r[field],change:changes.get(r.id+'.'+field)});const old=changes.get(r.id+'.'+field)?.old??r[field];r[field]=val;changes.set(r.id+'.'+field,{id:r.id,name:r.name,field,old,value:val});$('saved').textContent='预览修改已保留';render()});
document.querySelectorAll('[data-effect]').forEach(el=>el.onclick=()=>{dataset='effects';selected=effects.findIndex(x=>x.id===el.dataset.effect);view='record';checked.clear();render()});
document.querySelectorAll('[data-change]').forEach(el=>el.onclick=()=>{dataset=effects.some(x=>x.id===el.dataset.change)?'effects':'weapons';selected=rows().findIndex(x=>x.id===el.dataset.change);view='table';showDetail=true;render()});
drawViewControls();
}
function openData(type='weapons'){activeSavedView='all';dataset=type;selected=type==='weapons'?1:0;view='table';checked.clear();$('filter').value='';$('rarity').value='';render()}
document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{view=el.dataset.view;render()});
$('filter').oninput=render;$('rarity').onchange=render;$('detailToggle').onclick=()=>{showDetail=!showDetail;render()};$('closeDetail').onclick=()=>{showDetail=false;render()};
$('weaponFile').onclick=$('favorite').onclick=$('projectNav').onclick=$('dataTab').onclick=()=>openData();$('effectsFile').onclick=()=>openData('effects');$('schemaFile').onclick=()=>{view='schema';render()};$('changesNav').onclick=$('diffTab').onclick=()=>{view='diff';render()};
$('problemToggle').onclick=()=>$('problems').classList.toggle('open');$('problemNav').onclick=()=>$('problems').classList.add('open');$('jumpProblem').onclick=()=>{openData();selected=weapons.findIndex(x=>x.attack<=0);showDetail=true;render();document.querySelector('[data-row="'+selected+'"]')?.scrollIntoView({block:'nearest'});$('detailBody').querySelector('[data-field="attack"]').focus()};
$('undo').onclick=()=>{const h=history.pop();if(!h)return;h.r[h.field]=h.old;const key=h.r.id+'.'+h.field;h.change?changes.set(key,h.change):changes.delete(key);render();toast('已撤销最近一次字段修改')};
$('add').onclick=()=>{weapons.push({id:'new_weapon_'+weapons.length,name:'新武器',rarity:'普通',attack:1,speed:1,price:0,effect:'physical_hit'});selected=weapons.length-1;view='record';render();toast('已添加示例记录，可编辑字段')};$('build').onclick=()=>toast('布局预览：构建入口，未执行实际构建');
function search(){const q=$('searchInput').value.toLowerCase(),hits=[...weapons.map((r,i)=>({r,i,type:'weapons'})),...effects.map((r,i)=>({r,i,type:'effects'}))].filter(x=>Object.values(x.r).join(' ').toLowerCase().includes(q)).slice(0,7);$('searchResults').innerHTML=hits.map(x=>'<button class="result" data-type="'+x.type+'" data-index="'+x.i+'"><i data-icon="record"></i><span>'+esc(x.r.name)+'<div class="small muted mono">'+x.r.id+'</div></span><span class="spacer"></span><span class="small muted">'+x.type+'.cfd</span> ↗</button>').join('')||'<div class="empty">未找到记录</div>';icons($('searchResults'));$('searchResults').querySelectorAll('button').forEach(b=>b.onclick=()=>{dataset=b.dataset.type;selected=Number(b.dataset.index);checked.clear();$('filter').value='';$('rarity').value='';view='table';showDetail=true;$('searchDialog').close();render()})}
function openSearch(){$('searchDialog').showModal();search();$('searchInput').focus()}$('globalOpen').onclick=$('searchNav').onclick=openSearch;$('searchInput').oninput=search;$('settingsOpen').onclick=$('appearance').onclick=$('fontStatus').onclick=()=>$('settingsDialog').showModal();
function appearance(){document.documentElement.style.setProperty('--font',$('fontSelect').value+'px');document.documentElement.style.setProperty('--row',$('rowSelect').value+'px');const label=$('rowSelect').selectedOptions[0].text.split(' · ')[1];$('fontStatus').textContent=$('fontSelect').value+'px · '+label;$('density').innerHTML='<i data-icon="rows"></i>'+label;icons($('density'))}
$('fontSelect').onchange=$('rowSelect').onchange=appearance;$('density').onclick=()=>{$('rowSelect').value=$('rowSelect').value==='46'?'36':'46';appearance()};
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty('--accent',b.dataset.color);document.documentElement.style.setProperty('--soft',b.dataset.soft)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('searchDialog').open)openSearch()}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!document.querySelector('dialog[open]')){e.preventDefault();$('filter').focus()}});

const columns=[['rarity','品质',4],['attack','攻击力',5],['speed','间隔',6],['price','售价',7],['effect','效果引用',8]];
const savedViews=[
{id:'all',name:'全部记录',mode:'table',fields:columns.map(c=>c[0]),rarity:'',sort:''},
{id:'balance',name:'战斗数值',mode:'table',fields:['rarity','attack','speed'],rarity:'',sort:'attack'},
{id:'epic',name:'史诗武器',mode:'table',fields:['rarity','attack','price','effect'],rarity:'史诗',sort:''},
{id:'relations',name:'效果关系',mode:'graph',fields:columns.map(c=>c[0]),rarity:'',sort:''}
];
let activeSavedView='all',creatingView=false;
function activeConfig(){return savedViews.find(v=>v.id===activeSavedView)||savedViews[0]}
function drawViewControls(){
const cfg=activeConfig();$('modeSelect').value=['table','record','graph','source'].includes(view)?view:'source';
$('viewList').innerHTML=savedViews.map(v=>'<button class="namedview '+(v.id===activeSavedView?'active':'')+'" data-saved-view="'+v.id+'"><i data-icon="'+(v.mode==='graph'?'branch':v.mode==='source'?'code':v.mode)+'"></i>'+esc(v.name)+'<span class="viewtype">'+({table:'表格',record:'记录',graph:'图谱',source:'源码'}[v.mode])+'</span></button>').join('');
$('viewSummary').textContent=cfg.fields.length+' 个字段'+(cfg.rarity?' · '+cfg.rarity:' · 无品质筛选')+(cfg.sort?' · 已排序':'');
document.querySelectorAll('[data-saved-view]').forEach(b=>b.onclick=()=>{activeSavedView=b.dataset.savedView;const c=activeConfig();dataset='weapons';view=c.mode;$('rarity').value=c.rarity;$('filter').value='';checked.clear();render()});
if(view==='table'){
columns.forEach(([key,label,index])=>document.querySelectorAll('.table tr').forEach(tr=>{if(tr.children[index-1])tr.children[index-1].style.display=cfg.fields.includes(key)?'':'none'}));
document.querySelectorAll('.table tbody tr').forEach(tr=>{
['attack','speed','price'].forEach((field,j)=>{const td=tr.children[4+j];td.dataset.cell=field;td.title='点击编辑';
td.onclick=e=>{e.stopPropagation();if(td.querySelector('input'))return;const r=rows()[Number(tr.dataset.row)];td.innerHTML='<input class="cellinput" type="number" aria-label="编辑'+field+'" value="'+r[field]+'" step="'+(field==='speed'?'.1':'1')+'">';const input=td.firstElementChild;input.focus();input.select();let done=false;
function finish(cancel){if(done)return;done=true;const value=Number(input.value);if(!cancel&&input.value&&Number.isFinite(value)&&value!==r[field]){const key=r.id+'.'+field;history.push({r,field,old:r[field],change:changes.get(key)});const old=changes.get(key)?.old??r[field];r[field]=value;changes.set(key,{id:r.id,name:r.name,field,old,value});$('saved').textContent='预览修改已保留'}render()}
input.onblur=()=>finish(false);input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();finish(false)}if(e.key==='Escape'){e.preventDefault();finish(true)}}}
})
});
}
icons();
}
function openViewOptions(create=false){
creatingView=create;const cfg=activeConfig();$('viewDialogTitle').textContent=create?'新建视图':'视图选项';$('viewName').value=create?'新视图':cfg.name;$('viewMode').value=view==='diff'||view==='schema'?cfg.mode:view;$('viewRarity').value=$('rarity').value;$('viewSort').value=cfg.sort;
$('columnChecks').innerHTML='<label><input type="checkbox" checked disabled>名称 / ID（固定）</label>'+columns.map(([key,label])=>'<label><input type="checkbox" value="'+key+'" '+(cfg.fields.includes(key)?'checked':'')+'>'+label+'</label>').join('');
$('viewDialog').showModal()
}
$('favorite').onclick=()=>{activeSavedView='balance';dataset='weapons';view='table';$('rarity').value='';$('filter').value='';render()};
$('configureView').onclick=()=>openViewOptions();$('newView').onclick=()=>openViewOptions(true);
$('modeSelect').onchange=()=>{view=$('modeSelect').value;activeConfig().mode=view;render()};
$('saveView').onclick=()=>{const name=$('viewName').value.trim();if(!name){$('viewName').focus();return}const config={id:creatingView?'view_'+Date.now():activeSavedView,name,mode:$('viewMode').value,fields:[...$('columnChecks').querySelectorAll('input:checked:not(:disabled)')].map(el=>el.value),rarity:$('viewRarity').value,sort:$('viewSort').value};if(creatingView)savedViews.push(config);else savedViews[savedViews.findIndex(v=>v.id===activeSavedView)]=config;activeSavedView=config.id;view=config.mode;$('rarity').value=config.rarity;$('viewDialog').close();render()};

icons();render();
</script></body></html>
